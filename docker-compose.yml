name: thesis-submission-system

x-backend-image: &backend-image
  image: thesis-portal-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16
    container_name: thesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thesis_portal
      POSTGRES_USER: thesis_user
      POSTGRES_PASSWORD: thesis_pass
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL runs init scripts only when this persistent volume is empty.
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP becomes available after the first-time init scripts finish.
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend-seed:
    <<: *backend-image
    container_name: thesis_seed
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: thesis_portal
      POSTGRES_USER: thesis_user
      POSTGRES_PASSWORD: thesis_pass
    volumes:
      # Same path as the API, so seeded PDFs can be previewed and downloaded.
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Only a database marked by first-time init may receive automatic demo data.
    command: ["node", "scripts/seed-demo.cjs", "--initial-only"]

  backend:
    <<: *backend-image
    container_name: thesis_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret-change-me
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: thesis_portal
      POSTGRES_USER: thesis_user
      POSTGRES_PASSWORD: thesis_pass
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-hcmut.edu.vn}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run start:dev

  mailpit:
    image: axllent/mailpit
    container_name: thesis_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thesis_frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pg_data:
