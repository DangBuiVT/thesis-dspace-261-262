<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">HCMUT thesis portal use cases</title><desc id="desc">Student, reviewer, Editor, Final Editor, administrator, and SMTP actors with their week one to six use cases.</desc><style>text{font-family:Arial,sans-serif;fill:#24344b;font-size:15px}.heading{font-size:25px;fill:#132d65;font-weight:bold}.label{font-size:13px}path,line{stroke:#8b9db5;stroke-width:1.5;fill:none}</style><rect width="1200" height="880" fill="#f5f7fa"/><text x="44" y="50" class="heading">HCMUT Thesis Portal · Actor use cases</text><text x="44" y="78">Nhan · Weeks 1–6 · 4 November 2026</text><rect x="275" y="110" width="650" height="675" rx="12" fill="white" stroke="#becbda"/><text x="300" y="142" font-weight="bold">Portal boundary</text><path d="M145 205 L358 200"/><path d="M145 205 L618 200"/><path d="M145 205 L358 310"/><path d="M145 205 L618 420"/><path d="M145 400 L358 310"/><path d="M145 400 L618 310"/><path d="M145 400 L618 420"/><path d="M145 620 L358 310"/><path d="M145 620 L618 310"/><path d="M145 620 L358 420"/><path d="M145 620 L618 420"/><path d="M1045 225 L582 310"/><path d="M1045 225 L582 530"/><path d="M1045 225 L842 530"/><path d="M1045 225 L842 420"/><path d="M1045 465 L582 665"/><path d="M1045 680 L842 665"/><ellipse cx="470" cy="200" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="470" y="205" text-anchor="middle" class="label">Save draft / submit PDF</text><ellipse cx="730" cy="200" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="730" y="205" text-anchor="middle" class="label">Track / revise / resubmit</text><ellipse cx="470" cy="310" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="470" y="315" text-anchor="middle" class="label">Read metadata / preview PDF</text><ellipse cx="730" cy="310" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="730" y="315" text-anchor="middle" class="label">Accept / reject with reason</text><ellipse cx="470" cy="420" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="470" y="425" text-anchor="middle" class="label">Edit metadata</text><ellipse cx="730" cy="420" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="730" y="425" text-anchor="middle" class="label">Read approval history</text><ellipse cx="470" cy="530" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="470" y="535" text-anchor="middle" class="label">Return to Editor with reason</text><ellipse cx="730" cy="530" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="730" y="535" text-anchor="middle" class="label">Confirm portal archive</text><ellipse cx="470" cy="665" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="470" y="670" text-anchor="middle" class="label">Existing configuration</text><ellipse cx="730" cy="665" rx="114" ry="36" fill="#edf5ff" stroke="#94b5db"/><text x="730" y="670" text-anchor="middle" class="label">Deliver workflow email</text><circle cx="120" cy="175" r="13" fill="white" stroke="#132d65"/><path d="M120 188v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="120" y="277" text-anchor="middle">Student</text><circle cx="120" cy="370" r="13" fill="white" stroke="#132d65"/><path d="M120 383v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="120" y="472" text-anchor="middle">Reviewer</text><circle cx="120" cy="590" r="13" fill="white" stroke="#132d65"/><path d="M120 603v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="120" y="692" text-anchor="middle">Editor</text><circle cx="1070" cy="195" r="13" fill="white" stroke="#132d65"/><path d="M1070 208v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="1070" y="297" text-anchor="middle">Final Editor</text><circle cx="1070" cy="435" r="13" fill="white" stroke="#132d65"/><path d="M1070 448v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="1070" y="537" text-anchor="middle">Administrator</text><circle cx="1070" cy="650" r="13" fill="white" stroke="#132d65"/><path d="M1070 663v38m-24-25h48m-24 25l-22 28m22-28l22 28"/><text x="1070" y="752" text-anchor="middle">SMTP / Mailpit</text><text x="300" y="744" class="label">Return preserves academic decisions and PDF. Archive commits in the portal.</text><text x="300" y="765" class="label">Live DSpace publication and signing are separate integrations.</text><text x="44" y="836" class="label">Access to submission reading and history is restricted to owners/coauthors, assigned reviewers, and authorized staff.</text></svg>